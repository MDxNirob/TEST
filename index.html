<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b82f6">
  <title>PWA Test App</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #111827;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background-color: #1f2937;
      border: 1px solid #374151;
      border-radius: 1rem;
      padding: 2rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #60a5fa; }
    p { font-size: 0.95rem; line-height: 1.5; color: #9ca3af; margin-bottom: 1.5rem; }
    .status-badge {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      background-color: #374151;
      color: #fbbf24;
    }
    .status-badge.active {
      background-color: #065f46;
      color: #34d399;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PWA Ready</h1>
    <p>This dummy page tests service worker registration, standalone display mode, and PWABuilder compatibility.</p>
    <div id="sw-status" class="status-badge">Checking Service Worker...</div>
  </div>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => {
            const status = document.getElementById('sw-status');
            status.textContent = 'Service Worker: Active';
            status.classList.add('active');
          })
          .catch((err) => {
            document.getElementById('sw-status').textContent = 'Service Worker Failed';
            console.error('SW Error:', err);
          });
      });
    }
  </script>
</body>
</html>
